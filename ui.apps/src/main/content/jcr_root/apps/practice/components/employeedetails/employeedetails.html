<div data-emptytext="Employee Details Component" class="cq-placeholder"></div>
<div>
    <h2>Employee Details Component</h2>
    <div class="employeedetails__item" data-sly-test="${properties.name}">
        <p class="employeedetails__item-label">Name:</p>
        <pre class="employeedetails__item-output">${properties.name}</pre>
    </div>
    <div class="employeedetails__item" data-sly-test="${properties.age}">
        <p class="employeedetails__item-label">Age:</p>
        <pre class="employeedetails__item-output">${properties.age}</pre>
    </div>
    <div class="employeedetails__item" data-sly-test="${properties.phone}">
        <p class="employeedetails__item-label">Phone Number:</p>
        <pre class="employeedetails__item-output">${properties.phone}</pre>
    </div>
    <div class="employeedetails__item" data-sly-test="${properties.company}">
        <p class="employeedetails__item-label">Company:</p>
        <pre class="employeedetails__item-output">${properties.company}</pre>
    </div>
    <div class="employeedetails__item" data-sly-test="${properties.designation}">
        <p class="employeedetails__item-label">Designation:</p>
        <pre class="employeedetails__item-output">${properties.designation}</pre>
    </div>
</div>
